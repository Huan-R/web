<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>留言板</title>
</head>
<body>
  <main>
    <h1 style="color: red;">测试：2026-08-08</h1>

    <section id="auth-section">
      <form id="auth-form">
        <label for="email">邮箱</label>
        <br>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="name@example.com"
          autocomplete="email"
          required
        >

        <br><br>

        <label for="password">密码</label>
        <br>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="至少 6 位"
          autocomplete="current-password"
          minlength="6"
          required
        >

        <br><br>

        <button id="login-button" type="submit">登录</button>
        <button id="signup-button" type="button">注册</button>

        <p
          id="auth-message"
          role="status"
          style="font-size: 18px; font-weight: bold;"
        ></p>
      </form>
    </section>

    <section id="user-section" hidden>
      <p id="user-email"></p>
      <button id="logout-button" type="button">退出登录</button>
    </section>

    <hr>

    <section id="message-section" hidden>
      <h2>发布留言</h2>

      <form id="message-form">
        <textarea
          id="message-content"
          maxlength="500"
          placeholder="写下你的留言..."
          required
        ></textarea>
        <br><br>
        <button id="send-button" type="submit">发布留言</button>
        <p id="message-status"></p>
      </form>
    </section>

    <h2>全部留言</h2>
    <button id="refresh-button" type="button">刷新</button>
    <div id="messages-list">
      <p>正在初始化...</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://tbwflmrbulzikpwfacsx.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_l5BBojWCbaYM7SjfXLultg_etqwk8D1";

    const authForm = document.getElementById("auth-form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("login-button");
    const signupButton = document.getElementById("signup-button");
    const authMessage = document.getElementById("auth-message");

    const authSection = document.getElementById("auth-section");
    const userSection = document.getElementById("user-section");
    const userEmail = document.getElementById("user-email");
    const logoutButton = document.getElementById("logout-button");

    const messageSection = document.getElementById("message-section");
    const messageForm = document.getElementById("message-form");
    const messageContent = document.getElementById("message-content");
    const sendButton = document.getElementById("send-button");
    const messageStatus = document.getElementById("message-status");

    const refreshButton = document.getElementById("refresh-button");
    const messagesList = document.getElementById("messages-list");

    let client = null;
    let currentUser = null;

    function showAuthMessage(text, color) {
      authMessage.textContent = text;
      authMessage.style.color = color || "#111";
    }

    function showMessageStatus(text, color) {
      messageStatus.textContent = text;
      messageStatus.style.color = color || "#111";
    }

    function setButtonsDisabled(disabled) {
      loginButton.disabled = disabled;
      signupButton.disabled = disabled;
    }

    function updatePage(user) {
      currentUser = user;

      if (user) {
        authSection.hidden = true;
        userSection.hidden = false;
        messageSection.hidden = false;
        userEmail.textContent = "已登录：" + user.email;
      } else {
        authSection.hidden = false;
        userSection.hidden = true;
        messageSection.hidden = true;
        userEmail.textContent = "";
      }
    }

    async function registerUser() {
      if (!client) {
        showAuthMessage("错误：Supabase 尚未加载。", "red");
        return;
      }

      if (!authForm.reportValidity()) {
        showAuthMessage("请填写正确邮箱和至少 6 位密码。", "red");
        return;
      }

      showAuthMessage("正在注册，请稍候...", "#0b5cab");
      setButtonsDisabled(true);

      try {
        const result = await client.auth.signUp({
          email: emailInput.value.trim(),
          password: passwordInput.value,
          options: {
            emailRedirectTo: "https://huan-r.github.io/web/"
          }
        });

        if (result.error) {
          showAuthMessage("注册失败：" + result.error.message, "red");
          return;
        }

        if (result.data.session) {
          showAuthMessage("注册成功，已自动登录。", "green");
        } else {
          showAuthMessage(
            "注册成功。请打开邮箱并点击验证链接，然后返回本页登录。",
            "green"
          );
        }
      } catch (error) {
        showAuthMessage("注册程序错误：" + error.message, "red");
      } finally {
        setButtonsDisabled(false);
      }
    }

    async function loginUser(event) {
      event.preventDefault();

      if (!client) {
        showAuthMessage("错误：Supabase 尚未加载。", "red");
        return;
      }

      if (!authForm.reportValidity()) {
        showAuthMessage("请填写正确邮箱和至少 6 位密码。", "red");
        return;
      }

      showAuthMessage("正在登录，请稍候...", "#0b5cab");
      setButtonsDisabled(true);

      try {
        const result = await client.auth.signInWithPassword({
          email: emailInput.value.trim(),
          password: passwordInput.value
        });

        if (result.error) {
          showAuthMessage("登录失败：" + result.error.message, "red");
        }
      } catch (error) {
        showAuthMessage("登录程序错误：" + error.message, "red");
      } finally {
        setButtonsDisabled(false);
      }
    }

    async function logoutUser() {
      const result = await client.auth.signOut();

      if (result.error) {
        alert("退出失败：" + result.error.message);
      }
    }

    async function loadMessages() {
      if (!client) {
        messagesList.innerHTML = "<p>Supabase 未加载。</p>";
        return;
      }

      messagesList.innerHTML = "<p>正在加载留言...</p>";

      const result = await client
        .from("messages")
        .select("id, user_id, content, created_at")
        .order("created_at", { ascending: false });

      if (result.error) {
        messagesList.innerHTML =
          "<p>加载留言失败：" + result.error.message + "</p>";
        return;
      }

      if (result.data.length === 0) {
        messagesList.innerHTML = "<p>还没有留言。</p>";
        return;
      }

      messagesList.innerHTML = "";

      result.data.forEach(function (message) {
        const article = document.createElement("article");
        const date = new Date(message.created_at).toLocaleString("zh-CN");

        article.innerHTML =
          "<p>" + escapeHtml(message.content) + "</p>" +
          "<small>发布时间：" + date + "</small>";

        messagesList.appendChild(article);
      });
    }

    async function sendMessage(event) {
      event.preventDefault();

      const content = messageContent.value.trim();

      if (!content || !currentUser) {
        return;
      }

      sendButton.disabled = true;
      showMessageStatus("正在发布...", "#0b5cab");

      const result = await client.from("messages").insert({
        user_id: currentUser.id,
        content: content
      });

      sendButton.disabled = false;

      if (result.error) {
        showMessageStatus("发布失败：" + result.error.message, "red");
        return;
      }

      messageContent.value = "";
      showMessageStatus("留言已发布。", "green");
      loadMessages();
    }

    function escapeHtml(text) {
      const element = document.createElement("div");
      element.textContent = text;
      return element.innerHTML;
    }

    authForm.addEventListener("submit", loginUser);

    signupButton.addEventListener("click", function () {
      registerUser();
    });

    logoutButton.addEventListener("click", logoutUser);
    messageForm.addEventListener("submit", sendMessage);
    refreshButton.addEventListener("click", loadMessages);

    if (!window.supabase) {
      showAuthMessage(
        "Supabase SDK 加载失败。请检查网络后刷新页面。",
        "red"
      );
      messagesList.innerHTML = "<p>Supabase SDK 加载失败。</p>";
    } else {
      client = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

      client.auth.onAuthStateChange(function (_event, session) {
        updatePage(session ? session.user : null);
        loadMessages();
      });

      client.auth.getSession().then(function (result) {
        updatePage(result.data.session ? result.data.session.user : null);
        loadMessages();
      });
    }
  </script>
</body>
</html>
