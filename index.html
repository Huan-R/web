<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>留言板</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="panel">
      <h1>留言板</h1>

      <section id="auth-section">
        <form id="auth-form">
          <label for="email">邮箱</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="name@example.com"
            autocomplete="email"
            required
          >

          <label for="password">密码</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="至少 6 位"
            autocomplete="current-password"
            minlength="6"
            required
          >

          <div class="button-group">
            <button id="login-button" type="submit">登录</button>
            <button id="signup-button" class="button-secondary" type="button">
              注册
            </button>
          </div>

          <p id="auth-message" class="status" role="status"></p>
        </form>
      </section>

      <section id="user-panel"></section>

      <section id="message-form-section">
        <form id="message-form" hidden>
          <label for="message-content">发布留言</label>
          <textarea
            id="message-content"
            maxlength="500"
            placeholder="写下你的留言..."
            required
          ></textarea>

          <div class="form-footer">
            <span id="character-count">0 / 500</span>
            <button id="submit-message-button" type="submit">发布</button>
          </div>

          <p id="message-status" class="status" role="status"></p>
        </form>

        <p id="message-help">登录后即可发布留言。</p>
      </section>

      <section class="messages-section">
        <div class="section-header">
          <h2>全部留言</h2>
          <button id="refresh-button" class="button-secondary" type="button">
            刷新
          </button>
        </div>

        <div id="messages-list"></div>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
